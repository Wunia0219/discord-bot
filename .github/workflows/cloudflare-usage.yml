name: Cloudflare usage

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-usage
  cancel-in-progress: false

jobs:
  usage:
    if: github.repository == 'Wunia0219/discord-bot' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Find trusted notification state
        id: previous
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/admin/cloudflare-usage.js previous
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.previous.outputs.artifact != ''
        with:
          artifact-ids: ${{ steps.previous.outputs.artifact }}
          run-id: ${{ steps.previous.outputs.run }}
          github-token: ${{ github.token }}
          path: test-results/cloudflare-usage/previous
          digest-mismatch: error
      - name: Read account usage and prepare notification
        id: prepare
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_USAGE_DISCORD_WEBHOOK: ${{ secrets.CF_USAGE_DISCORD_WEBHOOK }}
          CF_USAGE_RESTORED: ${{ steps.previous.outputs.artifact != '' }}
        run: node scripts/admin/cloudflare-usage.js prepare
      - name: Persist intent before Discord POST
        id: intent
        if: steps.prepare.outputs.send == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cf-usage-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/cloudflare-usage/state.json
          retention-days: 7
          if-no-files-found: error
      - name: Notify maintenance channel
        id: notify
        if: steps.prepare.outputs.send == 'true'
        env:
          CF_INTENT_ARTIFACT_ID: ${{ steps.intent.outputs.artifact-id }}
          CF_USAGE_DISCORD_WEBHOOK: ${{ secrets.CF_USAGE_DISCORD_WEBHOOK }}
        run: node scripts/admin/cloudflare-usage.js send
      - name: Release intent when upload failed before POST
        if: always() && steps.intent.outcome == 'failure' && steps.notify.outcome == 'skipped'
        run: node scripts/admin/cloudflare-usage.js unsent
      - name: Save notification state
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cf-usage-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/cloudflare-usage/state.json
          retention-days: 7
          if-no-files-found: error
      - name: Usage summary
        if: always() && steps.prepare.outcome == 'success'
        run: node scripts/admin/cloudflare-usage.js summary
